name: Juryportal prüfen
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/jury-interaktive-oberflaeche]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: TypeScript und Produktions-Build prüfen
        run: npm run build
